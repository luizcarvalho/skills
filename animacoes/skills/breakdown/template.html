<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>/breakdown</title><script src="../../engine/core.js"></script></head>
<body>
<script>
E.register({
  defaults: {
    locale: 'pt-BR',
    duration: 6,
    animate: 3.6,               // segundos até o último item cair
    tag: '/breakdown',
    title: 'Uma lata de refrigerante',
    count: 9,                   // quantos itens caem (1 a 36). Use um número real/sourced.
    unit: 'cubos de açúcar',
    unitSingular: 'cubo de açúcar',
    note: 'Isso dá cerca de 35 g', // pílula final (null para esconder)
    container: { kind: 'can', label: 'COLA', color: '#8e3a22', labelColor: '#f6eee4' }, // kind: can | jar | box | none
    item: { kind: 'cube', color: '#f9f8f4', shade: '#dcd8d0' },  // kind: cube | ball
    colors: { bg: '#f3e4d6', ink: '#2a1910', title: '#9a5a3a', shadow: 'rgba(150,100,60,0.16)' },
  },
  setup(s, E) {
    const N = Math.max(1, Math.min(36, Math.round(s.count)));
    let k = 1; while (k * (k + 1) / 2 < N) k++;
    const hasC = s.container.kind !== 'none';
    const areaX0 = hasC ? 470 : 140, areaX1 = 1000, ground = 1420;
    const size = Math.min(112, (areaX1 - areaX0) / (k + .2));
    const cx = (areaX0 + areaX1) / 2, items = [];
    let left = N;
    for (let r = 0; left > 0; r++) {
      const inRow = Math.min(k - r, left);
      const x0 = cx - (k - r) * size / 2 + ((k - r) - inRow) * size / 2;
      for (let i = 0; i < inRow; i++) items.push({ x: x0 + i * size, y: ground - (r + 1) * size });
      left -= inRow;
    }
    const R = E.rng(7), speck = []; for (let i = 0; i < 14; i++) speck.push([R() * .9 + .05, R() * .9 + .05, R() * 2 + 1.2]);
    return { N, items, size, ground, hasC, speck };
  },
  draw(c, t, s, st, E) {
    const col = s.colors, z = st.size;
    c.fillStyle = col.bg; c.fillRect(0, 0, E.W, E.H);
    E.tag(c, s.tag, false);
    c.fillStyle = col.shadow; c.beginPath(); c.ellipse(st.hasC ? 620 : 560, st.ground + 8, st.hasC ? 520 : 440, 30, 0, 0, Math.PI * 2); c.fill();
    if (st.hasC) container(c, s.container, st.ground, E);
    const span = (s.animate - .5) / st.N, fall = .3;
    let n = 0, last = -9;
    st.items.forEach((q, i) => {
      const L = .2 + i * span; if (t < L) return;
      const p = E.prog(t, L, L + fall);
      let y = q.y - 820 * (1 - p * p);
      if (p >= 1) { n++; last = L + fall; y = q.y - z * .14 * Math.sin(Math.PI * E.prog(t, L + fall, L + fall + .16)); }
      c.save(); c.globalAlpha = E.clamp(p * 6); item(c, s.item, q.x, y, z, st.speck); c.restore();
    });
    E.T(c, s.title, 92, 410, '500 46px Inter', col.title);
    const pop = 1 + .1 * (1 - E.eout(E.prog(t, last, last + .2)));
    const fN = '800 210px Poppins', nw = E.tw(c, String(n), fN);
    c.save(); c.translate(92 + nw / 2, 595); c.scale(pop, pop); E.T(c, String(n), 0, 75, fN, col.ink, 'center'); c.restore();
    const unit = n === 1 ? s.unitSingular : s.unit;
    const uf = E.tw(c, unit, '700 66px Poppins') > 1000 - (92 + nw + 30) ? 52 : 66;
    E.T(c, unit, 92 + nw + 30, 655, `700 ${uf}px Poppins`, col.ink);
    if (s.note && t > s.animate) {
      const pa = E.eback(E.prog(t, s.animate, s.animate + .3)), f = '600 40px Inter', w = E.tw(c, s.note, f) + 64;
      c.save(); c.globalAlpha = E.clamp(E.prog(t, s.animate, s.animate + .12)); c.translate(92, 1500); c.scale(.85 + .15 * pa, .85 + .15 * pa);
      E.rr(c, 0, -44, w, 88, 44); c.fillStyle = col.ink; c.fill(); E.T(c, s.note, 32, 14, f, '#fff'); c.restore();
    }
  },
});

function item(c, it, x, y, s, speck) {
  if (it.kind === 'ball') {
    const g = c.createRadialGradient(x + s * .38, y + s * .35, s * .05, x + s / 2, y + s / 2, s * .55);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.35, it.color); g.addColorStop(1, it.shade);
    E.circle(c, x + s / 2, y + s / 2, s * .47); c.fillStyle = g; c.fill(); return;
  }
  const d = s * .125;
  c.fillStyle = E.mix(it.color, '#ffffff', .6); c.beginPath(); c.moveTo(x, y); c.lineTo(x + d, y - d); c.lineTo(x + s + d, y - d); c.lineTo(x + s, y); c.fill();
  c.fillStyle = it.shade; c.beginPath(); c.moveTo(x + s, y); c.lineTo(x + s + d, y - d); c.lineTo(x + s + d, y + s - d); c.lineTo(x + s, y + s); c.fill();
  c.fillStyle = it.color; c.fillRect(x, y, s, s);
  c.strokeStyle = 'rgba(0,0,0,0.07)'; c.lineWidth = 2; c.strokeRect(x + 1, y + 1, s - 2, s - 2);
  c.fillStyle = 'rgba(120,110,95,0.3)'; speck.forEach(([a, b, r]) => c.fillRect(x + a * s, y + b * s, r, r));
}

function container(c, k, ground, E) {
  c.save(); c.translate(240, ground - 295); c.rotate(-.07);
  const w = 282, h = 590, x = -w / 2, y = -h / 2;
  const body = c.createLinearGradient(x, 0, x + w, 0);
  body.addColorStop(0, E.mix(k.color, '#000000', .5)); body.addColorStop(.3, k.color); body.addColorStop(.62, E.mix(k.color, '#000000', .25)); body.addColorStop(1, E.mix(k.color, '#000000', .6));
  const metal = c.createLinearGradient(x, 0, x + w, 0);
  metal.addColorStop(0, '#8d8d92'); metal.addColorStop(.35, '#e2e2e6'); metal.addColorStop(.7, '#b0b0b6'); metal.addColorStop(1, '#7c7c82');
  const clipBody = () => {
    if (k.kind === 'jar') { E.rr(c, x, y + 60, w, h - 60, 46); }
    else if (k.kind === 'box') { c.beginPath(); c.rect(x, y + 20, w, h - 20); }
    else { E.rr(c, x, y + 26, w, h - 56, 34); }
  };
  if (k.kind === 'can') { E.rr(c, x + 10, y + h - 50, w - 20, 46, 16); c.fillStyle = metal; c.fill(); }
  clipBody(); c.fillStyle = body; c.fill();
  c.save(); clipBody(); c.clip();
  if (k.kind !== 'box') { c.strokeStyle = k.labelColor; c.lineWidth = 15; c.beginPath(); c.moveTo(x - 10, 70); c.bezierCurveTo(x + 80, -10, x + 170, 130, x + w + 10, 40); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,0.10)'; c.fillRect(x + 50, y, 26, h);
  if (k.label) { const room = k.kind === 'jar' ? h - 200 : h - 130, lw = E.tw(c, k.label, '800 124px Poppins'), f = lw > room ? Math.floor(124 * room / lw) : 124; c.save(); c.translate(0, k.kind === 'jar' ? 34 : 0); c.rotate(-Math.PI / 2); E.T(c, k.label, 0, 6, `800 ${f}px Poppins`, k.labelColor, 'center', 'middle'); c.restore(); }
  c.restore();
  if (k.kind === 'can') { E.rr(c, x + 6, y, w - 12, 46, 16); c.fillStyle = metal; c.fill(); c.fillStyle = 'rgba(0,0,0,0.18)'; c.fillRect(x + 12, y + 40, w - 24, 6); }
  if (k.kind === 'jar') { E.rr(c, x + 30, y + 10, w - 60, 60, 12); c.fillStyle = metal; c.fill(); }
  c.restore();
}
</script>
</body>
</html>
